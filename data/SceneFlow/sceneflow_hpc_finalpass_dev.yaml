DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING:   /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_train_dev.txt,
                EVALUATING: /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_valid_dev.txt,
                TESTING:    /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_test_dev.txt
            }
            DATA_PATH: /d/hpc/home/zr1677/datasets/sceneflow
            RETURN_RIGHT_DISP: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 320, 736 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

OPTIMIZATION:
    NUM_EPOCHS: 1
    # BATCH_SIZE_PER_GPU: 32 # depend on the model


TRAINER:
    EVAL_INTERVAL: 5
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 10
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True
    TEST_VISUALIZATION: True


    