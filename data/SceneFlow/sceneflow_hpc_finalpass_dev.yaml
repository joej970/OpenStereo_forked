DATA_CONFIG:
    # SUBSET_SIZE_TRAINING: 0.5    # Use 10% of training data
    # SUBSET_SIZE_VALID: 1.0       # Use 50% of validation data  
    # SUBSET_SIZE_TEST: 1.0        # Use 100% of test data
    # SUBSET_SELECTION_SEED: 42  # Seed for reproducibility

    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING:   /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_train_dev.txt,
                EVALUATING: /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_valid_dev.txt,
                TESTING:    /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_test_dev.txt
            }
            DATA_PATH: /d/hpc/home/zr1677/datasets/sceneflow
            RETURN_RIGHT_DISP: false
            RETURN_POS: true

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 320, 704 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 576, 960 ] }
            # - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: RightTopPad, SIZE: [ 576, 960 ] }
            # - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

OPTIMIZATION:
    NUM_EPOCHS: 40 # overrides model config
    # NUM_EPOCHS_IINET: 105 # overrides model config
    # NUM_EPOCHS_LEANSTEREO: 320 # overrides model config
    # NUM_EPOCHS_LIGHTSTEREO: 90 # overrides model config

