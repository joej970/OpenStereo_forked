DATA_CONFIG:
    SUBSET_SIZE_TRAINING: 0.5    # Use 10% of training data
    SUBSET_SIZE_VALID: 0.5       # Use 50% of validation data  
    SUBSET_SIZE_TEST: 0.5        # Use 100% of test data
    SUBSET_SELECTION_SEED: 42  # Seed for reproducibility

    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING:   /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_train.txt,
                EVALUATING: /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_valid.txt,
                TESTING:    /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_test.txt
            }
            DATA_PATH: /d/hpc/home/zr1677/datasets/sceneflow
            RETURN_RIGHT_DISP: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: RandomCrop, SIZE: [ 320, 736 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        TESTING:
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

OPTIMIZATION:
    NUM_EPOCHS: 50
    # BATCH_SIZE_PER_GPU: 32

TRAINER:
    EVAL_INTERVAL: 5
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 2
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: False
    EVAL_VISUALIZATION: False
    TEST_VISUALIZATION: True
    SAVE_ERROR_MAP_LIST: 
        - /d/hpc/home/zr1677/datasets/sceneflow/driving_finalpass/driving__frames_finalpass_webp/frames_finalpass_webp/15mm_focallength/scene_backwards/fast/left/0001.webp
        - /d/hpc/home/zr1677/datasets/sceneflow/driving_finalpass/driving__frames_finalpass_webp/frames_finalpass_webp/15mm_focallength/scene_backwards/fast/left/0001.webp
    


    