DATA_CONFIG:
    # SUBSET_SIZE_TRAINING: 0.01    # Use 10% of training data
    # SUBSET_SIZE_VALID: 0.01       # Use 50% of validation data  
    # SUBSET_SIZE_TEST: 0.01        # Use 100% of test data
    # SUBSET_SELECTION_SEED: 42  # Seed for reproducibility
    # SUBSET_SIZE_TRAINING: 0.4    # Use 10% of training data
    # SUBSET_SIZE_VALID: 0.2       # Use 50% of validation data  
    # SUBSET_SIZE_TEST: 0.1        # Use 100% of test data
    # SUBSET_SIZE_TRAINING: 0.7    # Use 10% of training data
    # SUBSET_SIZE_VALID: 0.7       # Use 50% of validation data  
    # SUBSET_SIZE_TEST: 0.7        # Use 100% of test data
    # SUBSET_SELECTION_SEED: 42  # Seed for reproducibility

    DATA_INFOS:
        -   DATASET: SceneFlowDataset
            DATA_SPLIT: {
                TRAINING:   /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_train.txt,
                EVALUATING: /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_valid.txt,
                TESTING:    /d/hpc/home/zr1677/datasets/sceneflow/sceneflow_finalpass_test.txt
            }
            DATA_PATH: /d/hpc/home/zr1677/datasets/sceneflow
            RETURN_RIGHT_DISP: false

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: CreateAdditionalDepthSource}
            - { NAME: RandomCrop, SIZE: [ 320, 736 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
            - { NAME: DownscaleDepthSource, DS_FACTOR: 2, METHOD: "nearest" } # options "nearest", "max"
            - { NAME: RandomNoiseOnDepthSource, PROB: 0.99, MAX_NOISE_LEVEL_PERC: 0.030} # Each pixel gets a different random noise value between -MAX_NOISE_LEVEL_PERC and +MAX_NOISE_LEVEL_PERC (0.02 => -2% <-> +2% change)
            - { NAME: RandomEraseOnDepthSource, PROB: 0.95, MAX_ITERATIONS: 10, BOUNDS: [3, 5] } # MAX_TIME Controls the maximum number of separate erase operations performed in a single augmentation. BOUNDS Defines the size range [min_size, max_size] for each erased rectangle.
            - { NAME: NormalizeDepthSource, MAX_DISP: 192 }  # Add normalization
        EVALUATING:
            - { NAME: CreateAdditionalDepthSource}
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
            - { NAME: DownscaleDepthSource, DS_FACTOR: 2, METHOD: "nearest" } # options "nearest", "max"
            - { NAME: FixedNoiseOnDepthSource, PROB: 0.99, MAX_NOISE_LEVEL_PERC: 0.030, SEED: 42 } # Each pixel gets a different random noise value between -MAX_NOISE_LEVEL_PERC and +MAX_NOISE_LEVEL_PERC (0.02 => -2% <-> +2% change)
            - { NAME: FixedEraseOnDepthSource, PROB: 0.95, MAX_ITERATIONS: 10, BOUNDS: [2, 3], SEED: 42 } # MAX_TIME Controls the maximum number of separate erase operations performed in a single augmentation. BOUNDS Defines the size range [min_size, max_size] for each erased rectangle.
            - { NAME: NormalizeDepthSource, MAX_DISP: 192 }  # Add normalization
        TESTING:
            - { NAME: CreateAdditionalDepthSource}
            - { NAME: RightTopPad, SIZE: [ 544, 960 ] }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
            - { NAME: DownscaleDepthSource, DS_FACTOR: 2, METHOD: "nearest" } # options "nearest", "max"
            - { NAME: FixedNoiseOnDepthSource, PROB: 0.99, MAX_NOISE_LEVEL_PERC: 0.015, SEED: 42 } # Each pixel gets a different random noise value between -MAX_NOISE_LEVEL_PERC and +MAX_NOISE_LEVEL_PERC (0.02 => -2% <-> +2% change)
            - { NAME: FixedEraseOnDepthSource, PROB: 0.95, MAX_ITERATIONS: 10, BOUNDS: [2, 3], SEED: 42 } # MAX_TIME Controls the maximum number of separate erase operations performed in a single augmentation. BOUNDS Defines the size range [min_size, max_size] for each erased rectangle.
            - { NAME: NormalizeDepthSource, MAX_DISP: 192 }  # Add normalization
            

OPTIMIZATION:
    NUM_EPOCHS: 50
    # BATCH_SIZE_PER_GPU: 32

TRAINER:
    EVAL_INTERVAL: 2
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 10
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True
    TEST_VISUALIZATION: True


    