DATA_CONFIG:


MODEL:
    NAME: oneStereo
    MAX_DISP: 192
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [1, 2, 4]
    LEFT_ATT: true
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''
    BACKBONE: MobileNetv2
    BACKBONE_PRETRAINED: True
    BACKBONE_CFGS: 
        CONCAT_LEFT_RIGHT: true # concatenates left and right images along batch before feeding to backbone
        CONCAT_LEFT_RIGHT_ALONG: vertical # horizontal, vertical, multicut 

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false
    BATCH_SIZE_PER_GPU: &bs 24
    NUM_EPOCHS: 90

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0012
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.3
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: norm
        CLIP_VALUE: 1.0
    # CLIP_GRAD:
    #     TYPE: value
    #     CLIP_VALUE: 0.1

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TESTING:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3