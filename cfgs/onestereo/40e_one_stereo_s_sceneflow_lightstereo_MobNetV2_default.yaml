DATA_CONFIG:


MODEL:
    NAME: oneStereo
    MAX_DISP: 192
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [1, 2, 4]
    LEFT_ATT: true
    FIND_UNUSED_PARAMETERS: false
    # CKPT: -1
    CKPT: 29
    CKPT_DIR: '/d/hpc/home/zr1677/OpenStereo_forked/output/SceneFlowDataset/oneStereo/40e_one_stereo_s_sceneflow_lightstereo_MobNetV2_default/40e_exp_40e_half_64314346/ckpt/'
    
    PRETRAINED_MODEL: ''
    BACKBONE: MobileNetv2
    BACKBONE_PRETRAINED: True
    BACKBONE_CFGS: 
        CONCAT_LEFT_RIGHT: true # concatenates left and right images along batch before feeding to backbone
        CONCAT_LEFT_RIGHT_ALONG: multicut # horizontal, vertical, multicut 
        H_DIVISION: 2
        W_DIVISION: 2

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false
    BATCH_SIZE_PER_GPU: &bs 16
    NUM_EPOCHS: 90
    OPTI_REINIT: true # in case of loading from a checkpoint, reinitialize the optimizer to follow new opt. configs

    # OPTIMIZER:
    #     NAME: AdamW
    #     LR: &lr 0.0012
    #     WEIGHT_DECAY: 1.0e-05
    #     EPS: 1.0e-08

    # SCHEDULER:
    #     NAME: OneCycleLR
    #     MAX_LR: *lr
    #     PCT_START: 0.3
    #     ON_EPOCH: False

    # CLIP_GRAD:
    #     TYPE: norm
    #     CLIP_VALUE: 1.0
    # # CLIP_GRAD:
    # #     TYPE: value
    # #     CLIP_VALUE: 0.1

    # CLIP_GRAD:
    #     TYPE: value
    #     CLIP_VALUE: 0.1

    # original
    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0024
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.15 # now we have only 30 epochs
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TESTING:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3