DATA_CONFIG:


MODEL:
    # NAME: LeanLightStereo
    NAME: oneStereo
    MAX_DISP: 192
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [1, 2, 4]
    LEFT_ATT: true
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''
    BACKBONE: LeanBackbone
    BACKBONE_CFGS: 
        CONCAT_LEFT_RIGHT: true # concatenates left and right images along batch before feeding to backbone
        OUTPUT_CHANNELS: [40, 40, 40] # at H/4, H/8, H/16
        HEAD_INTERMEDIATE_CHANNELS: [256, 256, 256]
        AGGREGATION_CHANNELS: 64
        UPSAMPLE_TYPE: 'guided'  # 'guided' or 'context_guided' or 'simple' or 'interpolate'
    BACKBONE_PRETRAINED: True
    COST_VOLUME_TYPE: SIMPLE_3D

    ADDITIONAL_DEPTH_SRC: false
    # BASIC_DEPTH_ENRICHEMENT_CHANNELS: [24, 16, 8]
    # FUSION_TYPE: "addition" # multiplication, concat
    # FUSION_CONVS: 2
    # EXPANSE_RATIO_DEPTH_SOURCE_AGGREGATION: 2
    # EXPANSE_RATIO_FUSION: 2
    # GATED_BRANCH_BEFORE_FUSION: true
    # ZERO_INITIALISED_CONV_BEFORE_FUSION: true

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: false
    BATCH_SIZE_PER_GPU: &bs 24
    NUM_EPOCHS: 90

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0003 #0.0024
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.3
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TESTING:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3