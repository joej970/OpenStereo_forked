DATA_CONFIG:


MODEL:
    NAME: oneStereo
    MAX_DISP: 192
    EXPANSE_RATIO: 4
    AGGREGATION_BLOCKS: [1, 2, 4]
    LEFT_ATT: true
    FIND_UNUSED_PARAMETERS: false
    CKPT: -1
    PRETRAINED_MODEL: ''
    BACKBONE: mobilenetv3_small_100
    BACKBONE_PRETRAINED: True
    COST_VOLUME_TYPE: SIMPLE_3D

    ADDITIONAL_DEPTH_SRC: true
    FUSION_TYPE: "concat" # multiplication, concat
    FUSION_CONVS: 4
    EXPANSE_RATIO_DEPTH_SOURCE_AGGREGATION: 4
    EXPANSE_RATIO_FUSION: 2

OPTIMIZATION:
    FREEZE_BN: false
    SYNC_BN: true
    AMP: true
    BATCH_SIZE_PER_GPU: &bs 24
    NUM_EPOCHS: 90

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0012 #0.0024
        WEIGHT_DECAY: 1.0e-05
        EPS: 1.0e-08

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.3
        ON_EPOCH: False
    # SCHEDULER:
    #     NAME: OneCycleLR
    #     MAX_LR: 0.001  # Reduce from 0.0024
    #     PCT_START: 0.3  # Longer warmup (30% of training)
    #     ON_EPOCH: False

    CLIP_GRAD:
        TYPE: norm
        CLIP_VALUE: 1.0
    # CLIP_GRAD:
    #     TYPE: value
    #     CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TESTING:
    BATCH_SIZE_PER_GPU: *bs
    MAX_DISP: 192
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3
